# SPDX-License-Identifier: MIT

description: |
  An LED strip that sits between ZMK's underglow and the real LED chain. The
  underglow keeps drawing its effect; this strip paints layer and key lights
  over that frame before passing it on.

compatible: "minimalpad,light-layers"

properties:
  led-strip:
    type: phandle
    required: true
    description: The real LED chain the frames go to.

  chain-length:
    type: int
    required: true
    description: The number of LEDs, the same as the real chain's. ZMK's underglow reads it.

  key-positions:
    type: array
    required: true
    description: The key position each LED sits under, in chain order.
