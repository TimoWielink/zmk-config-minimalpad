# &host_dial: a dial whose action each layer keeps on the pad, set from
# MinimalPad Studio with SET_DIAL (src/host/dial.c, src/behaviors/host_dial.c)
# SPDX-License-Identifier: MIT

description: Dial whose action MinimalPad Studio can set for each layer

compatible: "minimalpad,behavior-host-dial"

properties:
  "#sensor-binding-cells":
    type: int
    required: true
    const: 0
  clockwise:
    type: int
    required: true
    description: >
      The layer's dial value for a clockwise turn until Studio sets another: a
      &kp keycode, or a value from dt-bindings/minimalpad/dial.h
  counter-clockwise:
    type: int
    required: true
    description: The same for a counter-clockwise turn
  tap-ms:
    type: int
    default: 5
