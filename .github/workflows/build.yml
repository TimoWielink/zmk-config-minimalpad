name: Build ZMK firmware

on:
  push:
    branches:
      - '*'
    paths:
      - 'config/**'
      - '.github/workflows/**'
      - 'boards/**'
      - 'include/**'
      - 'src/**'
      - 'zephyr/**'
      - 'CMakeLists.txt'
      - 'Kconfig'
      - 'build.yaml'
  pull_request:
    branches:
      - '*'
    paths:
      - 'config/**'
      - '.github/workflows/**'
      - 'boards/**'
      - 'include/**'
      - 'src/**'
      - 'zephyr/**'
      - 'CMakeLists.txt'
      - 'Kconfig'
      - 'build.yaml'
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
