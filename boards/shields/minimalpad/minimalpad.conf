# Enable EC11 encoder with optimized settings
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_EC11_THREAD_PRIORITY=3
CONFIG_EC11_THREAD_STACK_SIZE=1024

# Enable RGB underglow with strong defaults
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# Idle lighting: when the pad goes idle the underglow fades out slowly, then
# switches off and cuts the LEDs' power. A key or the dial brings it straight
# back. This takes the place of ZMK's own AUTO_OFF_IDLE, which switches off at
# once (src/leds/idle_fade.c). The fade length is in milliseconds.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_MINIMALPAD_LEDS_IDLE_FADE=y
CONFIG_MINIMALPAD_LEDS_IDLE_FADE_MS=8000

# RGB underglow customization - higher brightness for better visibility
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=140
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=3
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0

# Enable USB and Bluetooth
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_BT=y

# Enable CDC ACM for ZMK Studio support
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_STACK=y

# Studio: disable the unlock requirement so the app can connect and edit
# without pressing a physical &studio_unlock key. (Default is y = locked until
# unlocked on-device.) Safe for a personal pad; anyone with USB access can edit.
CONFIG_ZMK_STUDIO_LOCKING=n

# Stronger Bluetooth configuration
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5 

# Ensure Bluetooth is advertised on startup
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Power management and sleep mode
# Idle: 30s after the last key press or dial turn the LEDs fade out. Bluetooth
#   stays connected, and a key press works straight away.
# Sleep: on battery, deep sleep after 12 hours without a key press or dial turn.
#   Bluetooth disconnects, the key press that wakes the pad only wakes it, and it
#   reconnects within a few seconds. With its LEDs off the pad draws little while
#   connected, so it only sleeps once it has been left alone, such as overnight.
#   It never sleeps on USB. Set CONFIG_ZMK_SLEEP=n to never sleep at all.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=43200000

# Improve modifier behavior
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_ZMK_HID_SEPARATE_MOD_RELEASE_REPORT=y
