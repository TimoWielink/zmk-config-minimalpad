# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
  # This branch builds one thing: the settings-reset image. It is kept apart from main
  # on purpose, because a release publishes every .uf2 the build makes, and this one
  # must never sit beside the firmware one wrong click away.
  #
  # It erases the pad's saved settings: every key changed in Studio, layer names, the
  # dials and lights set from Studio, and every Bluetooth pairing. Flash it, then flash
  # minimalpad_with_studio straight after. On its own it leaves a pad that does nothing.
  #
  # `nrf52840-nosd` is not optional. The firmware is built with that snippet, which puts
  # storage_partition at 0xd4000. A reset built without it erases wherever the stock
  # layout puts storage, which is not where the pad's settings are: it would report
  # success and change nothing.
  #
  # The image depends on the flash layout, not on the firmware version, so it only needs
  # building again if the partitions move. The shield turns ZMK_BLE off, so the host
  # module and the LED fade configure themselves out.
  - board: nice_nano//zmk
    shield: settings_reset
    snippet: nrf52840-nosd
    artifact-name: minimalpad_settings_reset
