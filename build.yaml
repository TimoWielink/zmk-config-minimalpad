# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  # One firmware, always with ZMK Studio, which MinimalPad Studio needs. The artifact
  # name is the .uf2 file's name, and a release adds the version to it.
  # .github/release-notes.md names the file, so change the two together.
  - board: nice_nano//zmk
    shield: minimalpad
    snippet: studio-rpc-usb-uart nrf52840-nosd
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: minimalpad_with_studio

  # The way back from a pad whose Bluetooth bonds have got into a state nothing
  # on a Mac can see or repair. Flashing the firmware above never clears them:
  # a firmware flash leaves the settings partition alone on purpose, which is
  # what makes a keymap survive an update. This build erases that partition and
  # stops, and is flashed before the firmware above, not instead of it.
  #
  # `nrf52840-nosd` is not optional here, and leaving it off is worse than
  # leaving the build out altogether. That snippet moves the partitions, putting
  # storage_partition at 0xd4000, and the firmware above is built with it. A
  # reset built without it erases wherever the stock layout puts storage, which
  # is not where these bonds are: it would report success and change nothing.
  #
  # The shield turns ZMK_BLE off, so the host module and the LED fade configure
  # themselves out (Kconfig, CMakeLists.txt) and nothing here needs a guard.
  - board: nice_nano//zmk
    shield: settings_reset
    snippet: nrf52840-nosd
    artifact-name: minimalpad_settings_reset
